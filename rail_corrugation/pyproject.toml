[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebulax-rail-cdm"
version = "0.1.0"
description = "Beginner-friendly Rail Corrugation baseline for NebulaX PS3"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "streamlit>=1.31,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
rail-inspect = "rail_cdm.inspect_data:main"
rail-train = "rail_cdm.train:main"
rail-predict = "rail_cdm.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
